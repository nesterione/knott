[project]
name = "knott"
version = "0.2.0"
description = "A local, file-first knowledge layer for AI agents: typed Markdown entities, schemas, and semantic relations."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Ihar Nestsiarenia" }]
keywords = ["markdown", "knowledge-base", "ai-agents", "obsidian", "schema", "frontmatter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
    "questionary>=2.1.1",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/nesterione/knott"
Repository = "https://github.com/nesterione/knott"
Issues = "https://github.com/nesterione/knott/issues"

[project.scripts]
knott = "knott.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8",
    "ruff>=0.5",
    "types-pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knott"]

[tool.hatch.build.targets.sdist]
exclude = ["docs/.obsidian", ".github"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
