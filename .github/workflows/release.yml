name: Release

# Push a tag like v0.1.0 (matching `version` in pyproject.toml) to publish to PyPI.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Check tag matches project version
        run: |
          version=$(uv version --short)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pyproject version ${version}" >&2
            exit 1
          fi
      - run: uv build
      - name: Smoke-test the wheel with uvx
        run: uvx --from dist/*.whl knott --help
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/knott
    permissions:
      id-token: write # PyPI trusted publishing (OIDC), no API token needed
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv publish --trusted-publishing always
