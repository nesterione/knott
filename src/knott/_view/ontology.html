<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knott Ontology</title>
<style>
  :root {
    --bg: #fbfaf8; --surface: #ffffff; --ink: #1d1d1f; --muted: #8a8a8e;
    --line: #c9c7c2; --border: #e4e2dd; --accent: #3b5bdb; --accent-soft: #e7ecfd;
    --panel-shadow: 0 8px 30px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141416; --surface: #1d1d20; --ink: #ececee; --muted: #8b8b92;
      --line: #4a4a50; --border: #2e2e33; --accent: #8ea2ff; --accent-soft: #23284a;
      --panel-shadow: 0 8px 30px rgba(0,0,0,.4);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font: 14px/1.45 ui-sans-serif, -apple-system, "SF Pro Text", "Inter", system-ui, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    display: flex; align-items: baseline; gap: 20px; padding: 18px 24px 0;
  }
  h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
  h1 span { color: var(--muted); font-weight: 400; margin-left: 6px; }
  .issues { padding: 4px 24px 0; color: var(--muted); font-size: 12px; }
  .issues code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11.5px; }
  #root { transition: transform .45s ease; }
  #root.still { transition: none; }
  nav { display: flex; gap: 2px; margin-left: auto; background: var(--border); padding: 2px; border-radius: 8px; }
  nav button {
    border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 13px;
    padding: 4px 12px; border-radius: 6px; cursor: pointer;
  }
  nav button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  main { flex: 1; position: relative; }
  svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .legend {
    position: absolute; left: 24px; bottom: 18px; color: var(--muted); font-size: 12px;
    display: flex; gap: 18px; align-items: center;
  }
  .legend svg { position: static; width: 28px; height: 8px; vertical-align: middle; margin-right: 6px; }
  .hint { position: absolute; left: 24px; top: 8px; color: var(--muted); font-size: 12px; }

  .edge path { fill: none; stroke: var(--line); stroke-width: 1.3; transition: stroke .15s, opacity .15s; }
  .edge.opt path { stroke-dasharray: 4 4; }
  .edge text { font-size: 11.5px; fill: var(--muted); paint-order: stroke; stroke: var(--bg); stroke-width: 5px; stroke-linejoin: round; transition: opacity .15s, fill .15s; }
  .edge.isa path { stroke-width: 1; }
  .node { cursor: pointer; }
  .node.abstract rect { stroke-dasharray: 5 3; }
  .node.abstract .name { font-style: italic; }
  .node.abstract .count { font-style: italic; }
  .node .fold { font-size: 11.5px; fill: var(--muted); font-variant-numeric: tabular-nums; }
  .node .fold:hover { fill: var(--accent); }
  .node .open { font-size: 11.5px; fill: var(--muted); }
  .openmode .node.hot .open { fill: var(--accent); }
  .node rect { fill: var(--surface); stroke: var(--border); stroke-width: 1; transition: stroke .15s, fill .15s; }
  .node .name { font-size: 13.5px; font-weight: 550; fill: var(--ink); }
  .node .count { font-size: 12px; fill: var(--muted); font-variant-numeric: tabular-nums; }
  .node:hover rect { stroke: var(--line); }
  .node.sel rect { stroke: var(--accent); fill: var(--accent-soft); }
  .dim .edge:not(.hot) { opacity: .15; }
  .dim .node:not(.hot) { opacity: .3; }
  .edge.hot path { stroke: var(--accent); }
  .edge.hot text { fill: var(--accent); }
  #arrow path { fill: var(--line); }
  #arrowHot path { fill: var(--accent); }
  #isa path { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
  #isaHot path { fill: var(--bg); stroke: var(--accent); stroke-width: 1.2; }

  aside {
    position: absolute; top: 12px; right: 12px; bottom: 12px; width: 320px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: var(--panel-shadow); padding: 20px 22px; overflow: auto;
    transform: translateX(calc(100% + 24px)); transition: transform .25s ease;
  }
  aside.open { transform: none; }
  aside h2 { font-size: 17px; margin: 0 0 2px; font-weight: 600; }
  aside .sub { color: var(--muted); font-size: 12.5px; margin-bottom: 12px; }
  aside p { margin: 0 0 18px; color: var(--ink); }
  aside h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; margin: 18px 0 8px; }
  aside table { width: 100%; border-collapse: collapse; font-size: 13px; }
  aside td { padding: 5px 0; border-top: 1px solid var(--border); vertical-align: top; }
  aside td:first-child { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12.5px; }
  aside td.t { color: var(--muted); text-align: right; white-space: nowrap; }
  aside td .d { display: block; color: var(--muted); font-family: inherit; font-size: 12px; margin-top: 1px; }
  aside a { color: var(--accent); text-decoration: none; cursor: pointer; }
  aside .req { color: var(--accent); }
  aside .unknown { color: var(--muted); font-style: italic; }
  aside details summary { cursor: pointer; color: var(--muted); font-size: 12.5px; }
  aside pre {
    margin: 8px 0 0; padding: 10px 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    font: 12px/1.5 ui-monospace, "SF Mono", Menlo, monospace; white-space: pre-wrap; overflow-wrap: anywhere;
  }
  aside .rel { color: var(--muted); }
  aside .group td { color: var(--muted); font-size: 12px; padding-top: 10px; }
  aside .relation { border-top: 1px solid var(--border); padding: 12px 0 4px; }
  aside .relation .name { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-weight: 600; }
  aside .relation .keys { color: var(--muted); font-size: 12.5px; margin-left: 8px; }
  aside .relation p { margin: 6px 0 0; }
  aside .relation .uses { margin-top: 8px; }
  aside .relation details { margin-top: 6px; }
  aside .relation .empty { margin-top: 6px; font-size: 12.5px; }
  aside .note { color: var(--muted); font-size: 12.5px; margin: -2px 0 10px; }
  aside .note code { font: 12px ui-monospace, "SF Mono", Menlo, monospace; }
  #outlineToggle, #relations, #loops, #fold, #open { border: 1px solid var(--border); background: var(--surface); color: var(--ink); font: inherit; font-size: 13px; padding: 4px 12px; border-radius: 8px; cursor: pointer; }
  #relations[hidden], #loops[hidden], #fold[hidden], #open[hidden] { display: none; }
  #open.on, #outlineToggle.on { border-color: var(--accent); color: var(--accent); }
  #outline { position: absolute; left: 0; top: 0; bottom: 0; width: 248px; overflow: auto; padding: 10px 8px 16px 16px; border-right: 1px solid var(--border); background: var(--bg); z-index: 1; }
  #outline[hidden] { display: none; }
  #outline .row { display: flex; align-items: baseline; gap: 10px; padding: 3px 8px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  #outline .row:hover, #outline .row.hot { background: var(--border); }
  #outline .row.sel { background: var(--accent-soft); color: var(--accent); }
  #outline .row .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #outline .row.abstract .name { font-style: italic; }
  #outline .row .n { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  main.outlined #svg { left: 248px; width: calc(100% - 248px); }
  main.outlined .legend, main.outlined .hint { left: 272px; }
  #loops.on { border-color: var(--accent); color: var(--accent); }
  #board { position: absolute; inset: 0; background: var(--bg); z-index: 2; display: flex; flex-direction: column; padding: 10px 24px 18px; }
  #board[hidden] { display: none; }
  #board .bar { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  #board select { font: inherit; font-size: 13px; color: var(--ink); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 4px 8px; max-width: 100%; }
  #board .follows { font: 12.5px ui-monospace, "SF Mono", Menlo, monospace; color: var(--muted); }
  #board .about { color: var(--muted); font-size: 13px; }
  #board .cols { flex: 1; display: flex; gap: 12px; overflow: auto; align-items: flex-start; }
  #board .col { flex: 0 0 236px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 10px; max-height: 100%; overflow: auto; }
  #board .col.exit, #board .col.none { opacity: .7; border-style: dashed; }
  #board .col > button { all: unset; cursor: pointer; display: flex; width: 100%; justify-content: space-between; align-items: baseline; font-weight: 600; font-size: 13.5px; }
  #board .col > button .n { color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }
  #board .about-stage { margin: 8px 0 2px; font-size: 12.5px; color: var(--muted); }
  #board .about-stage pre { margin: 6px 0 0; padding: 8px 10px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; font: 12px/1.5 ui-monospace, "SF Mono", Menlo, monospace; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--ink); }
  #board .card { margin-top: 8px; padding: 9px 10px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; }
  #board .card .title { font-weight: 550; overflow-wrap: anywhere; }
  #board .card .path { font: 11.5px ui-monospace, "SF Mono", Menlo, monospace; color: var(--muted); overflow-wrap: anywhere; user-select: all; }
  #board .card .next { margin-top: 6px; font-size: 12.5px; color: var(--muted); }
  #board .card .ready { color: var(--accent); }
  #board .card.unmet { border-color: #d6453d; }
  #board .card .bad { margin-top: 6px; font-size: 12.5px; color: #d6453d; }
  #board .col .empty { margin-top: 8px; font-size: 12.5px; }
  aside .stages { font-size: 12.5px; color: var(--muted); margin: 2px 0 6px; }
  aside .close { position: absolute; top: 14px; right: 16px; border: 0; background: none; color: var(--muted); font-size: 18px; cursor: pointer; }
  .empty { color: var(--muted); font-size: 13px; }
  @media (max-width: 640px) {
    header { padding: 14px 16px 0; flex-wrap: wrap; }
    .issues { padding: 4px 16px 0; }
    aside { width: auto; left: 12px; top: auto; height: 55%; z-index: 2; }
    #outline { width: 168px; padding-left: 8px; }
    main.outlined #svg { left: 168px; width: calc(100% - 168px); }
    main.outlined .legend, main.outlined .hint { left: 180px; }
  }
</style>
</head>
<body>
<header>
  <h1>Ontology <span id="meta"></span></h1>
  <button id="outlineToggle">Outline</button>
  <button id="relations" hidden>Relations</button>
  <button id="loops" hidden>Loops</button>
  <button id="fold" hidden>Fold subtypes</button>
  <button id="open" hidden>Open references</button>
  <nav id="tabs">
    <button data-l="layered" class="on">Layered</button>
    <button data-l="force">Force</button>
    <button data-l="radial">Radial</button>
  </nav>
</header>
<div class="issues" id="issues" hidden></div>
<main id="main">
  <div class="hint">Click a type for details · drag to move</div>
  <svg id="svg">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z"/></marker>
      <marker id="arrowHot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z"/></marker>
      <marker id="isa" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M1,1 L11,6 L1,11 z"/></marker>
      <marker id="isaHot" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M1,1 L11,6 L1,11 z"/></marker>
    </defs>
    <g id="root"><g id="edges"></g><g id="nodes"></g></g>
  </svg>
  <div class="legend">
    <span><svg viewBox="0 0 28 8"><line x1="0" y1="4" x2="28" y2="4" stroke="currentColor" stroke-width="1.3"/></svg>required</span>
    <span><svg viewBox="0 0 28 8"><line x1="0" y1="4" x2="28" y2="4" stroke="currentColor" stroke-width="1.3" stroke-dasharray="4 4"/></svg>optional</span>
    <span id="isaLegend" hidden><svg viewBox="0 0 28 8"><line x1="0" y1="4" x2="21" y2="4" stroke="currentColor" stroke-width="1"/><path d="M21,1 L27,4 L21,7 z" fill="none" stroke="currentColor" stroke-width="1"/></svg>is a</span>
  </div>
  <div id="outline" hidden></div>
  <aside id="panel"></aside>
  <section id="board" hidden></section>
</main>

<script>
const DATA = /*__DATA__*/;

// ---------- model ----------
// Lookups keyed by type name have no prototype, so names like "constructor" stay plain keys.
const dict = () => Object.create(null);
// allNodes: every type. nodes: the types on screen, i.e. those no folded ancestor hides.
const allNodes = DATA.types.map(t => ({ id: t.type, count: t.count, countAll: t.count_with_subtypes ?? t.count, parent: t.extends || null, abstract: !!t.abstract, ancestors: t.ancestors || [], subtypes: t.subtypes || [], kidRequired: t.kid_required, entityPaths: t.entity_paths || [], filename: t.filename || null, description: t.description, properties: t.properties, template: t.template, x: 0, y: 0, w: 0, h: 34 }));
let nodes = allNodes;
const byId = dict();
for (const n of allNodes) byId[n.id] = n;
for (const n of allNodes) n.below = allNodes.filter(o => o.ancestors.includes(n.id)).length; // subtypes at any depth
// DATA.edges: one per known target of each reference property, at the type that declares it,
// with its path (OntologyType.references(): "[]" for list items, ".*" for map values, ".field"
// for object fields) and the relation it names; an edge is labelled with the relation, else
// with the path. DATA.inheritance: one {child, parent} per type that extends another.
const REFS = DATA.edges.filter(d => byId[d.source] && byId[d.target]);
const ISA = (DATA.inheritance || []).filter(d => byId[d.child] && byId[d.parent]);
// Open references (`target: any`): no edge is drawn; the declaring type carries a "→ any" mark.
const OPEN = DATA.reference_properties.filter(p => p.open && byId[p.type]);
const openLabel = p => p.path + (p.relation ? ` (${p.relation})` : "");
for (const n of allNodes) n.open = OPEN.filter(p => p.type === n.id);
// Folding: a folded type hides its subtypes; rep(id) is the type drawn in place of id,
// the farthest folded ancestor, or id itself.
const folded = new Set();
const rep = id => { let r = id; for (const a of byId[id].ancestors) if (folded.has(a)) r = a; return r; };
const from = type => ` <span class="rel">from ${link(type)}</span>`;
// edges: what is drawn now. kind "ref": a reference, moved to the folded ancestor of a hidden
// end; kind "isa": child to parent, never a reference. Rebuilt by buildEdges() on every fold.
let edges = [];
const referencedBy = dict();
for (const r of DATA.referenced_by) referencedBy[r.type] = r.groups;

const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs = {}, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent && parent.appendChild(e); return e; };
const svg = document.getElementById("svg"), gR = document.getElementById("root"), gE = document.getElementById("edges"), gN = document.getElementById("nodes");
const panel = document.getElementById("panel");
const ctx = document.createElement("canvas").getContext("2d");
const textW = (s, font) => (ctx.font = font, ctx.measureText(s).width);
const plural = (k, one, many) => `${k} ${k === 1 ? one : many}`;
const cubic = (t, p0, p1, p2, p3) => { const u = 1 - t; return u * u * u * p0 + 3 * u * u * t * p1 + 3 * u * t * t * p2 + t * t * t * p3; };

// ---------- header ----------
{
  const known = DATA.types.length, entities = DATA.types.reduce((a, t) => a + t.count, 0);
  document.getElementById("meta").textContent =
    [DATA.vault, plural(known, "type", "types"), plural(REFS.length, "reference", "references"), plural(entities, "entity", "entities")].join(" · ");
  document.title = `${DATA.vault} · Knott Ontology`;
  if (DATA.schema_issues > 0) {
    const box = document.getElementById("issues");
    box.innerHTML = `${plural(DATA.schema_issues, "schema issue", "schema issues")} — run <code>knott validate</code>`;
    box.hidden = false;
  }
}

// ---------- render nodes ----------
const NAME_FONT = "550 13.5px -apple-system, system-ui, sans-serif";
for (const n of allNodes) {
  const g = el("g", { class: "node" + (n.abstract ? " abstract" : "") }, gN);
  n.rect = el("rect", {}, g);
  n.tName = el("text", { class: "name", y: 4.5 }, g); n.tName.textContent = n.id;
  // a type with subtypes carries a fold mark: "▾ N" unfolded, "▸ N" folded (N subtypes)
  if (n.below) {
    n.tFold = el("text", { class: "fold", y: 4.5 }, g);
    el("title", {}, n.tFold).textContent = "Fold or unfold subtypes";
    n.tFold.addEventListener("click", ev => { ev.stopPropagation(); toggleFold(n.id); });
    n.tFold.addEventListener("pointerdown", ev => ev.stopPropagation());
  }
  // a type that declares open references says so once: "→ any", "×N" for several;
  // sizeNode() fills it, with those of the subtypes folded into the type
  n.tOpen = el("text", { class: "open", y: 4.5 }, g);
  n.tOpenTitle = el("title", {}, n.tOpen);
  // an abstract type has no entities of its own: it says so where the count would be
  n.tCount = el("text", { class: "count", y: 4.5, "text-anchor": "end" }, g); n.tCount.textContent = n.abstract ? "abstract" : n.count;
  n.g = g;
  sizeNode(n);
  g.addEventListener("click", ev => { if (!dragMoved) select(n.id); ev.stopPropagation(); });
  g.addEventListener("mouseenter", () => focusOn(n.id));
  g.addEventListener("mouseleave", () => focusOn(selected));
  g.addEventListener("pointerdown", ev => startDrag(ev, n));
}
function sizeNode(n) {
  const nameW = textW(n.id, (n.abstract ? "italic " : "") + NAME_FONT);
  const mark = n.below ? `${folded.has(n.id) ? "▸" : "▾"} ${n.below}` : "";
  const markW = mark ? textW(mark, "11.5px -apple-system, system-ui, sans-serif") + 10 : 0;
  const cntW = textW(n.tCount.textContent, "12px -apple-system, system-ui, sans-serif") + 14;
  n.shownOpen = OPEN.filter(p => rep(p.type) === n.id);
  const openMark = n.shownOpen.length ? "→ any" + (n.shownOpen.length > 1 ? ` ×${n.shownOpen.length}` : "") : "";
  n.tOpen.firstChild.nodeType === 3 ? n.tOpen.firstChild.nodeValue = openMark : n.tOpen.insertBefore(document.createTextNode(openMark), n.tOpen.firstChild);
  n.tOpenTitle.textContent = n.shownOpen.map(p => (p.type === n.id ? "" : p.type + ".") + openLabel(p)).join(", ");
  const openW = openMark ? textW(openMark, "11.5px -apple-system, system-ui, sans-serif") + 10 : 0;
  n.w = Math.round(nameW + markW + openW + cntW + 32);
  n.rect.setAttribute("x", -n.w / 2); n.rect.setAttribute("y", -n.h / 2);
  n.rect.setAttribute("width", n.w); n.rect.setAttribute("height", n.h); n.rect.setAttribute("rx", n.h / 2);
  n.tName.setAttribute("x", -n.w / 2 + 16);
  n.tCount.setAttribute("x", n.w / 2 - 16);
  if (n.tFold) { n.tFold.firstChild.nodeType === 3 ? n.tFold.firstChild.nodeValue = mark : n.tFold.insertBefore(document.createTextNode(mark), n.tFold.firstChild); n.tFold.setAttribute("x", -n.w / 2 + 16 + nameW + 8); }
  n.tOpen.setAttribute("x", -n.w / 2 + 16 + nameW + markW + 8);
}
function buildEdges() {
  gE.textContent = "";
  edges = [];
  const drawn = dict(), pairs = dict();
  for (const d of REFS) {
    const s = rep(d.source), t = rep(d.target), name = d.relation || d.path, moved = s !== d.source || t !== d.target;
    // edges that share source, target and label once an end is folded away are drawn once,
    // required if any of them is
    const key = JSON.stringify([s, t, name]), same = drawn[key];
    if (same && (moved || same.moved)) { same.req = same.req || d.required; same.moved = true; continue; }
    const e = { kind: "ref", s, t, path: d.path, relation: d.relation, name, req: d.required, moved };
    drawn[key] ||= e;
    edges.push(e);
  }
  // "is a": from child to parent, only between types on screen
  for (const d of ISA) if (rep(d.child) === d.child) edges.push({ kind: "isa", s: d.child, t: d.parent, req: true });
  // e.k: index among the edges joining the same two types (either direction); e.n: how many there are
  for (const e of edges) (pairs[JSON.stringify([e.s, e.t].sort())] ||= []).push(e);
  for (const key in pairs) pairs[key].forEach((e, i, all) => { e.k = i; e.n = all.length; });
  for (const e of edges) {
    const isa = e.kind === "isa";
    const g = el("g", { class: "edge" + (isa ? " isa" : e.req ? "" : " opt") }, gE);
    e.p = el("path", { "marker-end": isa ? "url(#isa)" : "url(#arrow)" }, g);
    if (!isa) { e.l = el("text", { "text-anchor": "middle" }, g); e.l.textContent = e.name; }
    e.g = g;
  }
}
const labelAt = (e, x, y) => { if (e.l) { e.l.setAttribute("x", x); e.l.setAttribute("y", y); } };

// ---------- geometry ----------
function clip(n, tx, ty) { // point on pill border toward (tx,ty)
  const dx = tx - n.x, dy = ty - n.y;
  if (!dx && !dy) return [n.x, n.y];
  const hw = n.w / 2 + 3, hh = n.h / 2 + 3;
  const t = Math.min(dx ? hw / Math.abs(dx) : Infinity, dy ? hh / Math.abs(dy) : Infinity);
  return [n.x + dx * t, n.y + dy * t];
}
function loopCorners(n) { // pill corners [sx, sy] (+1/-1 per axis), farthest from the node's other edges first; ties keep above-right first
  const dirs = [];

  setHash("loop=" + encodeURIComponent(boardLoop));
  const loop = report.loop, about = dict();
  for (const s of [...loop.stages, ...loop.exits]) about[s.name] = s;
  const card = e => `<div class="card${e.unmet.length ? " unmet" : ""}">
    <div class="title">${esc(e.title)}</div><div class="path">${esc(e.path)}${e.type && e.type !== loop.type ? ` · ${esc(e.type)}` : ""}</div>
    ${e.unmet.length ? `<div class="bad">stage needs: ${e.unmet.map(n => esc(needLabel(n))).join(", ")}</div>` : ""}
    ${e.next !== null ? `<div class="next">next: ${esc(e.next)} — ${e.missing_next.length ? "needs " + e.missing_next.map(n => esc(needLabel(n))).join(", ") : e.unmet.length ? "after this stage's needs" : '<span class="ready">ready</span>'}</div>` : ""}
  </div>`;
  const column = (label, entities, kind, stage) => `<div class="col ${kind}">
    <button title="Show what this stage needs"><span>${esc(label)}</span><span class="n">${entities.length}</span></button>
    <div class="about-stage" hidden>${stage && stage.needs.length ? "needs: " + stage.needs.map(n => esc(needLabel(n))).join(", ") : "no needs"}${stage && stage.guidance !== null ? `<pre>${esc(stage.guidance)}</pre>` : ""}</div>
    ${entities.map(card).join("") || '<div class="empty">None</div>'}
  </div>`;
  boardEl.innerHTML = `<div class="bar">
      <select aria-label="Loop">${LOOPS.map(r => `<option value="${esc(r.loop.name)}"${r === report ? " selected" : ""}>${esc(r.loop.name)}</option>`).join("")}</select>
      <span class="follows">${esc(loop.type)}.${esc(loop.property)}</span>
      ${loop.description ? `<span class="about">${esc(loop.description)}</span>` : ""}
    </div>
    <div class="cols">
      ${report.stages.map(p => column(p.stage, p.entities, "stage", about[p.stage])).join("")}
      ${report.exits.map(p => column(p.stage, p.entities, "exit", about[p.stage])).join("")}
      ${report.unplaced.length ? column("no stage", report.unplaced, "none", null) : ""}
    </div>`;
  boardEl.hidden = false;
  boardEl.querySelector("select").onchange = ev => showBoard(ev.target.value);
  boardEl.querySelectorAll(".col > button").forEach(b => b.onclick = () => { const d = b.nextElementSibling; d.hidden = !d.hidden; });
}
loopsButton.textContent = `Loops (${LOOPS.length})`;
loopsButton.hidden = !LOOPS.length;
loopsButton.onclick = () => boardLoop === null ? showBoard(null) : closeBoard();

function showPanel(id) {
  const n = byId[id];
  // a type's own settings and those of its ancestors, root first: what it inherits, then its own
  const chain = [...n.ancestors].reverse().concat(id);
  const out = REFS.filter(d => chain.includes(d.source)).sort((a, b) => chain.indexOf(a.source) - chain.indexOf(b.source));
  const row = (a, b, c, d, depth = 0) => `<tr><td${depth ? ` class="nested" style="padding-left:${depth * 14}px"` : ""}>${a}${d ? `<span class="d">${esc(d)}</span>` : ""}</td><td class="t">${b}${c ? ' <span class="req" title="required">●</span>' : ""}</td></tr>`;
  // Object fields are listed under their attribute, indented; a list's items or map's values
  // are folded into the notation ("list of object") with their description appended.
  const attrRows = (list, depth = 0) => list.map(a => {
    let node = a;
    const notes = a.description ? [a.description] : [];
    while (node.items || node.values) {
      const inner = node.items || node.values;
      if (inner.description) notes.push(`${node.items ? "each item" : "each value"}: ${inner.description}`);
      node = inner;
    }
    // an enum lists its options, with their descriptions when any has one
    const opts = node.options || [];
    if (opts.length) notes.push(opts.some(o => o.description)
      ? opts.map(o => o.description ? `${o.value}: ${o.description}` : o.value).join(" · ")
      : "one of: " + opts.map(o => o.value).join(" | "));
    return row(esc(a.name) + (a.inherited_from ? from(a.inherited_from) : ""), notation(a), a.required, notes.join(" · "), depth) + attrRows(node.fields || [], depth + 1);
  }).join("");
  // DATA.referenced_by: per type, the properties that can point at it, grouped and
  // labelled like `knott refs` (an inverse, a symmetric relation, "← relation", "← type.path")
  const groups = referencedBy[id] || [];
  const incRows = groups.map(g => `<tr class="group"><td colspan="2" title="${esc(g.kind)}">${esc(g.label)}</td></tr>` +
    g.references.map(r => row(link(r.type) + "." + esc(r.path) + (r.via ? ` <span class="rel">via ${link(r.via)}</span>` : ""), "", r.required)).join("")).join("");
  // open references, own and inherited: listed under "References out", pointing at "any"
  const outOpen = OPEN.filter(p => chain.includes(p.type)).sort((a, b) => chain.indexOf(a.type) - chain.indexOf(b.type));
  // every open reference in the vault can point here: one folded group, counted apart
  const anywhere = OPEN.length ? `<details><summary>from anywhere · ${OPEN.length}</summary><table>${OPEN.map(p => row(property(p) + (p.relation ? ` <span class="rel">(${esc(p.relation)})</span>` : ""), "", p.required)).join("")}</table></details>` : "";
  const typeLoops = LOOPS.filter(r => chain.includes(r.loop.type));
  const family = [n.parent ? `extends ${link(n.parent)}` : "", n.abstract ? "abstract" : "", n.subtypes.length ? `subtypes: ${n.subtypes.map(link).join(", ")}` : ""].filter(Boolean).join(" · ");
  const head = `${family ? `<div class="sub">${family}</div>` : ""}<div class="sub">${plural(n.count, "entity", "entities")}${n.below ? ` · ${n.countAll} with subtypes` : ""}${n.kidRequired ? " · kid required" : ""}</div>${n.entityPaths.length ? `<div class="sub">stored in ${n.entityPaths.map(p => `<code>${esc(p)}</code>`).join(" or ")}</div>` : ""}${n.filename ? `<div class="sub">named <code>${esc(n.filename.pattern)}.md</code></div>${n.filename.parts.length ? `<table>${n.filename.parts.map(p => `<tr><td>${esc(p.name)}</td><td>${p.match ? `<code>${esc(p.match)}</code>` : ""}${p.description ? `<div class="sub">${esc(p.description)}</div>` : ""}</td></tr>`).join("")}</table>` : ""}` : ""}${n.description ? `<p>${esc(n.description)}</p>` : ""}`;
  panel.innerHTML = `
    <button class="close" aria-label="Close">×</button>
    <h2>${esc(n.id)}</h2>
    ${head}
    <h3>Properties</h3>
    ${n.properties.length ? `<table>${attrRows(n.properties)}</table>` : '<div class="empty">None</div>'}
    <h3>Template</h3>
    ${n.template !== null ? `<details><summary>Entity body template</summary><pre>${esc(n.template)}</pre></details>` : '<div class="empty">None</div>'}
    <h3>References out</h3>
    ${out.length + outOpen.length ? `<table>${out.map(d => row(esc(d.path) + (d.relation ? ` <span class="rel">(${esc(d.relation)})</span>` : "") + (d.source !== id ? from(d.source) : ""), "→ " + link(d.target), d.required)).join("")}${outOpen.map(p => row(esc(p.path) + (p.relation ? ` <span class="rel">(${esc(p.relation)})</span>` : "") + (p.type !== id ? from(p.type) : ""), "→ any", p.required)).join("")}</table>` : '<div class="empty">None</div>'}
    <h3>Referenced by</h3>
    ${groups.length ? `<table>${incRows}</table>` : anywhere ? "" : '<div class="empty">None</div>'}
    ${anywhere}
    ${typeLoops.length ? `<h3>Loops</h3>${typeLoops.map(r => `<div class="relation">
      <a data-loop="${esc(r.loop.name)}">${esc(r.loop.name)}</a><span class="keys">${esc(r.loop.property)}</span>${r.loop.type !== id ? from(r.loop.type) : ""}
      <div class="stages">${[...r.stages.map(p => `${esc(p.stage)} ${p.entities.length}`), ...(r.exits.length ? ["(" + r.exits.map(p => `${esc(p.stage)} ${p.entities.length}`).join(" · ") + ")"] : [])].join(" → ").replace(" → (", " · (")}</div>
      <table>${r.loop.stages.filter(s => s.needs.length).map(s => row(esc(s.name), s.needs.map(n => esc(needLabel(n))).join(", "), false)).join("")}</table>
    </div>`).join("")}` : ""}`;
  panel.classList.add("open");
  panel.querySelector(".close").onclick = () => select(id);
  panel.querySelectorAll("[data-go]").forEach(a => a.onclick = () => { selected = null; select(a.dataset.go); });
  panel.querySelectorAll("[data-loop]").forEach(a => a.onclick = () => showBoard(a.dataset.loop));
}
svg.addEventListener("click", () => { if (selected) select(selected); else if (relationsOpen) showRelations(); });

// resize: refit force positions as they are; re-run the other layouts for the new size
let resizeTimer = 0;
addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if (!nodes.length) return; if (mode === "force") fit(false); else arrange(true); }, 120);
});

// ---------- outline ----------
// The types as a tree (spec 0015): roots by name, subtypes by name under their parent, always
// fully expanded. A row stands for its type's box: hovering highlights it, a click selects it.
const OUTLINE_KEY = "knott-ontology-outline", outlineEl = document.getElementById("outline"), outlineButton = document.getElementById("outlineToggle");
{
  const kids = dict(), roots = [];
  for (const n of allNodes.slice().sort((a, b) => a.id < b.id ? -1 : a.id > b.id ? 1 : 0)) (n.parent && byId[n.parent] ? (kids[n.parent] ||= []) : roots).push(n);
  const add = (n, depth) => {
    const row = document.createElement("div");
    row.className = "row" + (n.abstract ? " abstract" : "");
    row.style.paddingLeft = 8 + depth * 16 + "px";
    if (n.description) row.title = n.description.trim();
    const name = document.createElement("span"); name.className = "name"; name.textContent = n.id; row.appendChild(name);
    if (!n.abstract) { const count = document.createElement("span"); count.className = "n"; count.textContent = n.count; row.appendChild(count); }
    // a type hidden by a folded ancestor is stood for by that ancestor's box
    row.addEventListener("mouseenter", () => focusOn(rep(n.id)));
    row.addEventListener("mouseleave", () => focusOn(selected));
    row.addEventListener("click", () => {
      if (boardLoop !== null) return;
      if (rep(n.id) !== n.id) { for (const a of n.ancestors) folded.delete(a); applyFold(); }
      select(n.id);
    });
    n.row = row;
    outlineEl.appendChild(row);
    for (const k of kids[n.id] || []) add(k, depth + 1);
  };
  for (const n of roots) add(n, 0);
}
function setOutline(on, instant) {
  outlineEl.hidden = !on;
  document.getElementById("main").classList.toggle("outlined", on);
  outlineButton.classList.toggle("on", on);
  try { localStorage.setItem(OUTLINE_KEY, on ? "1" : "0"); } catch (_) {}
  // the diagram keeps the remaining width: lay it out again for the new size
  if (!instant && nodes.length) { if (mode === "force") fit(true); else arrange(false); }
}
outlineButton.onclick = () => setOutline(outlineEl.hidden);
{ let on = false; try { on = localStorage.getItem(OUTLINE_KEY) === "1"; } catch (_) {} if (on) setOutline(true, true); }

const openLoop = location.hash.startsWith("#loop=") ? decodeURIComponent(location.hash.slice(6)) : null;
applyFold(true);
if (nodes.length) setMode(initialMode(), true);
else document.querySelector(".hint").textContent = "No types to show — add concept files to .knott/concepts/";
if (openLoop !== null && LOOPS.some(r => r.loop.name === openLoop)) showBoard(openLoop);
</script>
